<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="240" height="300" role="img" aria-labelledby="t d">
  <title id="t">Rikuy, la piedra que mira</title>
  <desc id="d">Mascota de Rikuy: una piedra de río con un solo ojo grande que cuelga de una cuerda con nudo, como un péndulo. Lleva una franja de rombos escalonados. Su ojo la hace curiosa; el movimiento es un balanceo suave.</desc>
  <!-- Construccion: peg r8 en (120,16) / cuerda 5 px Sol con nudo en (120,66) / cuerpo = huevo irregular 172 x 184 / dos facetas planas (luz y sombra) / franja de 11 rombos de 16 px / ojo: esclera r42, iris r24 Foton, pupila r11, brillos r5 y r2.5 / ceja 8 px. Estados: curiosa, piensa, celebra, sin red (se sustituye el grupo #rikuy-eye, la ceja y la boca). -->
  <style>
    .rk-swing { transform-origin: 120px 16px; }
    @media (prefers-reduced-motion: no-preference) {
      .rk-swing { animation: rk-sw 4.2s ease-in-out infinite alternate; }
      @keyframes rk-sw { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    }
  </style>
  <defs><clipPath id="f-clip"><path d="M120 92 C170 90 206 128 206 180 C206 234 168 276 118 276 C70 276 34 236 34 182 C34 130 72 94 120 92Z"/></clipPath></defs>
<g class="rk-swing" style="transform-origin:120px 16px">
