  <path d="M114 63 l12 6 M114 69 l12 -6" stroke="#8A5E00" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="16" r="8" fill="#F5F6F1" stroke="#0D2B33" stroke-width="3.5"/>
